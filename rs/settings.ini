[general]
# 極值統計主期間：建議至少 5 年；本版直接採 2018/01/01 至今。
start_date = 2018-01-01
end_date = auto

# 為了讓 2018/01/01 一開始就能算 250 日 RS、MA200、52週高低點，
# 同時還要有 60 日市場廣度均線，因此會額外往前抓約 550 個日曆日。
history_calendar_days = 550

# 同時抓日期數。公司網路不穩時建議 1；一般家用網路可改 2。
workers = 1

[strategy]
# 尼克萊公開主策略：年 RS > 85
rs_threshold = 85
rs_days = 250
ma50_days = 50
ma200_days = 200
high_low_days = 250

# 尼克萊公開：成交金額 > 3000 萬
amount_min = 30000000

# 公開只說「距一年高點不遠／距一年低點有一定距離」，未公開精確百分比。
# 本版維持可重現的近似值，可自行調整後用 03_RECALCULATE_ONLY.cmd 重算。
max_below_52w_high_pct = 25
min_above_52w_low_pct = 30

[extreme]
# 水位主要用「強勢股占有效樣本比例」判斷，避免 2018 與 2026 上市櫃家數不同造成失真。
low_extreme_percentile = 10
high_extreme_percentile = 90
very_low_percentile = 5
very_high_percentile = 95

[trend]
# 近3年滾動百分位：756交易日約等於3年；至少252交易日才開始計算。
rolling_percentile_days = 756
rolling_percentile_min_periods = 252
