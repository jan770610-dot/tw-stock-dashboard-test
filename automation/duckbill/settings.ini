[general]
# 股價初始化往前抓多少日曆日；180天通常足夠 MA60。
history_calendar_days = 180


# v23 預備鴨嘴（正式5/5成立前的早期觀察）
# 1=啟用；0=關閉。
preduck_enabled = 1
# 至少已符合幾條正式條件；建議3。系統只列3/5或4/5。
preduck_min_pass = 3
# 若「收盤尚未同時站上MA20/MA60」，距較高那條均線最多允許差幾%。
preduck_price_near_pct = 2.0
# 若「MA20尚未站上MA60」，MA20最多允許落後MA60幾%。
preduck_ma_cross_near_pct = 1.0
# 若均線當日尚未上揚，允許的微幅下降幅度（相對各自均線）。
preduck_ma20_slope_near_pct = 0.20
preduck_ma60_slope_near_pct = 0.10
# 若MA20-MA60開口尚未擴大，允許日變化最低到 MA60 的 -0.10%。
preduck_spread_near_pct = 0.10

# 三率三升：1=允許差值為0；0=三率都必須嚴格 > 0。
three_rates_allow_equal = 1
# 營收三增三項最低門檻（百分點）。
revenue_growth_min_pct = 0

# v15 第一次/修復時會用 MOPS 官方歷史資料強制補洞；已有資料只補缺口。
fundamental_backfill_quarters = 12
revenue_backfill_months = 24

# v28 每日驗收模式：0=每日不碰不穩定的 MOPS 舊 HTML 逐檔歷史頁。
# 12季深度歷史不影響當期三率；若未來要專門做深度回測再另行回補。
deep_financial_history_on_daily = 0

# EPS / 估值（v23：估值母體為全部上市＋上櫃普通股）
# Yahoo Finance / yfinance 季度 EPS：1=啟用。
yfinance_eps_enabled = 1
# Yahoo 財報需要逐檔查詢，不建議每天全市場約2000檔全抓。
# 系統會先挑「鴨嘴＋接近估值買進區」的優先名單，最多抓以下檔數。
yfinance_eps_max_stocks = 400
# 併發數 1~8；公司/網路若容易被限流可改 2。
yfinance_eps_workers = 4

# v25：當官方季報不足以比較最近兩季三率時，才用 Yahoo Finance 季度損益表補強。
# 只寫入保守可得日 <= 目標日的季度，避免未來季度穿越。
yfinance_income_fallback_max_stocks = 350
yfinance_income_workers = 3
# 估值買進門檻前再多抓多少百分點。例如買進門檻10%、buffer=10，則初估折價>=0%都納入 Yahoo 優先名單。
yfinance_eps_candidate_buffer_pct = 10

valuation_history_years = 3
# v13 合理價改用 TWSE/TPEx 官方歷史 PER；本機股價仍保留供技術面與交叉檢查。
valuation_min_price_samples = 60
valuation_pe_min = 3
valuation_pe_max = 100
# v13 官方歷史PER採每月最後交易日抽樣；至少24筆才計算分位數。
valuation_min_pe_samples = 24
valuation_deep_discount_pct = 20
valuation_buy_discount_pct = 10
